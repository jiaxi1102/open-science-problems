name: Exact KG(12,3) two-K4 cube decomposition

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - tools/kneser_exact_cnf.py
      - tools/kneser_r3_cube.py
      - .github/workflows/kneser-r3-two-k4-cubes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cubes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the 7 plus 14 orbit decomposition is exhaustive
        run: python tools/kneser_r3_cube.py list | tee cube-orbits.json
      - uses: actions/upload-artifact@v4
        with:
          name: kg12-two-k4-cube-orbits
          path: cube-orbits.json
          retention-days: 30

  solve-cube:
    needs: verify-cubes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        include:
          - {seed: matching, state: '001100'}
          - {seed: matching, state: '001101'}
          - {seed: matching, state: '001110'}
          - {seed: matching, state: '011110'}
          - {seed: matching, state: '100001'}
          - {seed: matching, state: '100011'}
          - {seed: matching, state: '101101'}
          - {seed: path, state: '001100'}
          - {seed: path, state: '001101'}
          - {seed: path, state: '001110'}
          - {seed: path, state: '010010'}
          - {seed: path, state: '010011'}
          - {seed: path, state: '010110'}
          - {seed: path, state: '011010'}
          - {seed: path, state: '011110'}
          - {seed: path, state: '100001'}
          - {seed: path, state: '100011'}
          - {seed: path, state: '100101'}
          - {seed: path, state: '101001'}
          - {seed: path, state: '101101'}
          - {seed: path, state: '110011'}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate prime-closed exact CNF and apply exhaustive cube
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          python tools/kneser_exact_cnf.py generate \
            --n 12 --k 3 --seed '${{ matrix.seed }}' --closure prime \
            --cnf out/base.cnf \
            --metadata out/base-metadata.json
          python tools/kneser_r3_cube.py apply \
            --seed '${{ matrix.seed }}' --state '${{ matrix.state }}' \
            --input out/base.cnf --output out/cube.cnf \
            --metadata out/cube-metadata.json
          grep '^p cnf' out/base.cnf out/cube.cnf | tee out/cnf-sizes.txt

      - name: Build pinned Satsuma and Kissat
        shell: bash
        run: |
          set -euxo pipefail

          git clone --quiet --recurse-submodules https://github.com/markusa4/satsuma.git /tmp/satsuma
          git -C /tmp/satsuma checkout --quiet c6ad1b59f29fa32dae587ef369135735f40d498a
          git -C /tmp/satsuma submodule update --init --recursive
          cmake -S /tmp/satsuma -B /tmp/satsuma/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/satsuma/build --target satsuma --parallel 2

          git clone --quiet https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd /tmp/kissat
          ./configure
          make -C build -j2

          test -x /tmp/satsuma/build/satsuma
          test -x /tmp/kissat/build/kissat
          /tmp/kissat/build/kissat --version > "$GITHUB_WORKSPACE/out/kissat-version.txt"

      - name: Break the residual cube symmetries
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/satsuma/build/satsuma fix --add-reduced-as-unit out/cube.cnf \
            > out/symmetry-broken.cnf 2> out/satsuma.log
          grep '^p cnf' out/cube.cnf out/symmetry-broken.cnf | tee -a out/cnf-sizes.txt

      - name: Solve cube and independently validate any witness
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 20m \
            /tmp/kissat/build/kissat out/symmetry-broken.cnf \
            > out/solver.log 2>&1
          rc=$?
          set -e

          if grep -q 's SATISFIABLE' out/solver.log; then
            status=SATISFIABLE
            python tools/kneser_exact_cnf.py check \
              --n 12 --k 3 --seed '${{ matrix.seed }}' \
              --model out/solver.log \
              --out out/validated-witness.json
          elif grep -q 's UNSATISFIABLE' out/solver.log; then
            status=UNSATISFIABLE
          elif [[ "$rc" -eq 124 || "$rc" -eq 137 || "$rc" -eq 143 ]]; then
            status=TIMEOUT
          else
            status=ERROR
          fi

          python - "$status" "$rc" '${{ matrix.seed }}' '${{ matrix.state }}' <<'PY'
          import json, pathlib, sys
          status, rc, seed, state = sys.argv[1:]
          base = json.loads(pathlib.Path('out/base-metadata.json').read_text())
          cube = json.loads(pathlib.Path('out/cube-metadata.json').read_text())
          result = {
              **base,
              **cube,
              'solver': 'kissat',
              'solver_status': status,
              'solver_exit_code': int(rc),
              'satsuma_commit': 'c6ad1b59f29fa32dae587ef369135735f40d498a',
              'kissat_commit': '8af8e56f174b778aef3aa45af9f739b2a5f492c2',
          }
          pathlib.Path('out/result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          if [[ "$status" == 'ERROR' ]]; then
            tail -200 out/solver.log
            exit 1
          fi

      - name: Upload cube evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg12-cube-${{ matrix.seed }}-${{ matrix.state }}
          path: |
            out/base-metadata.json
            out/cube-metadata.json
            out/result.json
            out/validated-witness.json
            out/cnf-sizes.txt
            out/satsuma.log
            out/solver.log
            out/kissat-version.txt
          if-no-files-found: warn
          retention-days: 30
