name: research math-0003 uniform trace gadgets

on:
  push:
    branches: [research/math-0003-exact-r3]
    paths:
      - tools/general_trace_gadget_sat.py
      - .github/workflows/research-math-0003-uniform-trace-gadgets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        m: [4, 5, 6, 7, 8, 9]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate complete pure-trace quotient
        shell: bash
        run: |
          set -euo pipefail
          M='${{ matrix.m }}'
          DIR="uniform-trace-$M"
          mkdir -p "$DIR"
          python tools/general_trace_gadget_sat.py --m "$M" --slack 3 generate \
            --cnf "$DIR/instance.cnf" \
            --metadata "$DIR/instance-metadata.json" \
            --map "$DIR/instance-map.json"

      - name: Install pinned Kissat and DRAT checker
        shell: bash
        run: |
          set -euo pipefail
          M='${{ matrix.m }}'
          DIR="uniform-trace-$M"
          curl --fail --location --retry 3 \
            https://github.com/arminbiere/kissat/releases/download/rel-4.0.4/kissat-4.0.4-linux-amd64.zip \
            --output kissat.zip
          echo '63282e5168ca040a2018edfba0726bf893a7a6bcdb1db87feb67857e2da697a7  kissat.zip' \
            | sha256sum --check --strict
          unzip -q kissat.zip -d kissat-dist
          KISSAT=''
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'ELF'; then
              KISSAT="$candidate"
              break
            fi
          done < <(find kissat-dist -type f -print | sort)
          test -n "$KISSAT"
          chmod +x "$KISSAT"
          "$KISSAT" --version | tee "$DIR/kissat-version.txt"
          echo "KISSAT=$GITHUB_WORKSPACE/$KISSAT" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c \
            --output "$DIR/drat-trim.c"
          gcc -O3 -DNDEBUG "$DIR/drat-trim.c" -o "$DIR/drat-trim"

      - name: Solve and certify pure trace quotient
        shell: bash
        run: |
          set -euo pipefail
          M='${{ matrix.m }}'
          DIR="uniform-trace-$M"
          set +e
          "$KISSAT" --time=1200 "$DIR/instance.cnf" "$DIR/proof.drat" \
            > "$DIR/kissat.out" 2> "$DIR/kissat.err"
          code=$?
          set -e
          printf '%s\n' "$code" > "$DIR/kissat.exit-code.txt"
          if [ "$code" -eq 10 ]; then
            python tools/general_trace_gadget_sat.py --m "$M" --slack 3 verify-model \
              --solver-output "$DIR/kissat.out" \
              --certificate "$DIR/sat-certificate.json"
            printf 'SAT_UNIFORM_TRACE_GADGET_VERIFIED\n' > "$DIR/status.txt"
          elif [ "$code" -eq 20 ]; then
            "$DIR/drat-trim" "$DIR/instance.cnf" "$DIR/proof.drat" \
              > "$DIR/drat-trim.out" 2> "$DIR/drat-trim.err"
            grep -q 'VERIFIED' "$DIR/drat-trim.out"
            printf 'UNSAT_PURE_TRACE_GADGET_DRAT_VERIFIED\n' > "$DIR/status.txt"
          else
            printf 'INCONCLUSIVE_EXIT_%s\n' "$code" > "$DIR/status.txt"
            exit 1
          fi
          cat "$DIR/status.txt"

      - name: Record checksums and compress proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          M='${{ matrix.m }}'
          DIR="uniform-trace-$M"
          find "$DIR" -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -print0 | sort -z | xargs -0 sha256sum > "$DIR/SHA256SUMS.txt"
          if [ -s "$DIR/proof.drat" ]; then
            gzip -9 "$DIR/proof.drat"
          fi

      - name: Upload gadget result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-0003-uniform-trace-${{ matrix.m }}
          path: uniform-trace-${{ matrix.m }}/
          if-no-files-found: error
          retention-days: 90
