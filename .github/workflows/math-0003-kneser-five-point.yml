name: math-0003 five-point Kneser lower bound

on:
  push:
    branches: [math-0003-five-point-kneser]
    paths:
      - problems/math-0003-kneser-ramsey-lower-bound/**
      - tools/verify_kneser_five_point.py
      - tools/verify_kneser_padding.py
      - .github/workflows/math-0003-kneser-five-point.yml
  pull_request:
    paths:
      - problems/math-0003-kneser-ramsey-lower-bound/**
      - tools/verify_kneser_five_point.py
      - tools/verify_kneser_padding.py
      - .github/workflows/math-0003-kneser-five-point.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify all trace partitions and r=1..4 regressions
        run: |
          python tools/verify_kneser_five_point.py > five-point-verification.json
          cat five-point-verification.json

      - name: Verify asymmetric padding for s=3..8
        run: |
          python tools/verify_kneser_padding.py > padding-verification.json
          cat padding-verification.json

      - name: Reject unfinished or hand-written axiomatic shortcuts
        shell: bash
        working-directory: problems/math-0003-kneser-ramsey-lower-bound/formal
        run: |
          if grep -RInE --include='*.lean' '\b(sorry|admit)\b' .; then
            echo "Unfinished proof marker found"
            exit 1
          fi
          if grep -RInE --include='*.lean' '^[[:space:]]*axiom[[:space:]]' .; then
            echo "Hand-written axiom found"
            exit 1
          fi

      - name: Build diagonal and asymmetric Lean lower bounds
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: problems/math-0003-kneser-ramsey-lower-bound/formal
          build: true
          test: false
          lint: false
          leanchecker: false
          axiom-audit: true
          axiom-audit-root: KneserFivePoint
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Audit the actual final theorem declarations
        shell: bash
        working-directory: problems/math-0003-kneser-ramsey-lower-bound/formal
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee theorem-axioms.txt
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('theorem-axioms.txt').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          names = [
              'KneserFivePoint.kneserRamsey_three_three_lower_bound',
              'KneserFivePoint.padding_blue_triangle_free',
              'KneserFivePoint.kneserRamsey_asymmetric_lower_bound',
          ]
          for name in names:
              pattern = re.escape("'" + name + "'") + r' depends on axioms:\s*\[([^\]]*)\]'
              match = re.search(pattern, text)
              if match is None:
                  raise SystemExit('Missing explicit axiom output for ' + name)
              used = {x.strip() for x in match.group(1).split(',') if x.strip()}
              if not used <= allowed:
                  raise SystemExit('Unexpected axioms for ' + name + ': ' + str(used - allowed))
              print('PASS', name, sorted(used))
          PY

      - name: Package verified source and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-kneser
          git archive HEAD \
            problems/math-0003-kneser-ramsey-lower-bound \
            tools/verify_kneser_five_point.py \
            tools/verify_kneser_padding.py \
            .github/workflows/math-0003-kneser-five-point.yml \
            | tar -x -C verified-kneser
          cp five-point-verification.json padding-verification.json verified-kneser/
          cp problems/math-0003-kneser-ramsey-lower-bound/formal/theorem-axioms.txt verified-kneser/
          git rev-parse HEAD > verified-kneser/SOURCE_COMMIT.txt
          printf '%s\n' "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > verified-kneser/VERIFICATION_RUN.txt
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('verified-kneser')
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(root).as_posix()
                   for p in sorted(root.rglob('*')) if p.is_file()]
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY

      - name: Upload verified theorem package
        uses: actions/upload-artifact@v4
        with:
          name: kneser-asymmetric-verified
          path: verified-kneser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
