name: Exact KG(11,3) plus one apex

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - tools/kneser_exact_cnf.py
      - tools/kneser_r3_apex_cnf.py
      - .github/workflows/kneser-r3-one-apex-exact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [matching, path]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the exact one-apex CNF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/kneser_r3_apex_cnf.py generate \
            --seed '${{ matrix.seed }}' --closure prime \
            --cnf out/original.cnf \
            --metadata out/metadata.json
          grep '^p cnf' out/original.cnf | tee out/cnf-sizes.txt

      - name: Build pinned Satsuma and Kissat
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet --recurse-submodules https://github.com/markusa4/satsuma.git /tmp/satsuma
          git -C /tmp/satsuma checkout --quiet c6ad1b59f29fa32dae587ef369135735f40d498a
          git -C /tmp/satsuma submodule update --init --recursive
          cmake -S /tmp/satsuma -B /tmp/satsuma/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/satsuma/build --target satsuma --parallel 2

          git clone --quiet https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd /tmp/kissat
          ./configure
          make -C build -j2

          test -x /tmp/satsuma/build/satsuma
          test -x /tmp/kissat/build/kissat
          /tmp/kissat/build/kissat --version > "$GITHUB_WORKSPACE/out/kissat-version.txt"

      - name: Break the one-apex symmetries
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/satsuma/build/satsuma fix --add-reduced-as-unit out/original.cnf \
            > out/symmetry-broken.cnf 2> out/satsuma.log
          grep '^p cnf' out/original.cnf out/symmetry-broken.cnf | tee -a out/cnf-sizes.txt

      - name: Decide the one-apex branch
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 20m \
            /tmp/kissat/build/kissat out/symmetry-broken.cnf \
            > out/solver.log 2>&1
          rc=$?
          set -e

          if grep -q 's SATISFIABLE' out/solver.log; then
            status=SATISFIABLE
            python tools/kneser_r3_apex_cnf.py check \
              --seed '${{ matrix.seed }}' \
              --model out/solver.log \
              --out out/validated-witness.json
          elif grep -q 's UNSATISFIABLE' out/solver.log; then
            status=UNSATISFIABLE
          elif [[ "$rc" -eq 124 || "$rc" -eq 137 || "$rc" -eq 143 ]]; then
            status=TIMEOUT
          else
            status=ERROR
          fi

          python - "$status" "$rc" '${{ matrix.seed }}' <<'PY'
          import json, pathlib, sys
          status, rc, seed = sys.argv[1:]
          metadata = json.loads(pathlib.Path('out/metadata.json').read_text())
          result = {
              **metadata,
              'solver': 'kissat',
              'solver_status': status,
              'solver_exit_code': int(rc),
              'satsuma_commit': 'c6ad1b59f29fa32dae587ef369135735f40d498a',
              'kissat_commit': '8af8e56f174b778aef3aa45af9f739b2a5f492c2',
          }
          pathlib.Path('out/result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          if [[ "$status" == ERROR ]]; then
            tail -200 out/solver.log
            exit 1
          fi

      - name: Upload one-apex evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg11-r3-one-apex-${{ matrix.seed }}
          path: |
            out/metadata.json
            out/result.json
            out/validated-witness.json
            out/cnf-sizes.txt
            out/satsuma.log
            out/solver.log
            out/kissat-version.txt
          if-no-files-found: warn
          retention-days: 30
