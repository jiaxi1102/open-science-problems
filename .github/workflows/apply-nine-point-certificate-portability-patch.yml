name: Apply nine-point certificate portability patch

on:
  push:
    branches: [math-0003-local-link-k5]
    paths:
      - tools/apply_nine_point_certificate_portability_patch.py
      - .github/workflows/apply-nine-point-certificate-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-0003-local-link-k5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_nine_point_certificate_portability_patch.py
      - name: Commit the portability fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/verify_kneser_nine_point_link_k5.py \
            problems/math-0003-kneser-ramsey-lower-bound/proof/nine-point-link-k5.md
          git diff --cached --check
          git commit -m 'Make nine-point proof certificate portable'
          git push origin HEAD:math-0003-local-link-k5
