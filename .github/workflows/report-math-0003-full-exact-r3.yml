name: report math-0003 full exact-r3 result

on:
  push:
    branches: [research/math-0003-exact-r3]
    paths:
      - .github/workflows/report-math-0003-full-exact-r3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for the unrestricted solve and publish only certified status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '33697432020'
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/jiaxi1102/open-science-problems'
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs/$RUN_ID" > run.json
            status="$(python -c 'import json; print(json.load(open("run.json"))["status"])')"
            conclusion="$(python -c 'import json; print(json.load(open("run.json")).get("conclusion"))')"
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              break
            fi
            sleep 30
          done

          if [ "$status" != completed ]; then
            cat > comment.md <<EOF
          <!-- math-0003-full-exact-r3-report -->
          ## Unrestricted \`KG(12,3)\` solve

          The result watcher timed out while workflow \`$RUN_ID\` was still \`$status\`. No mathematical conclusion is drawn.
          EOF
            gh pr comment 11 --repo jiaxi1102/open-science-problems --body-file comment.md
            exit 0
          fi

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$RUN_ID/artifacts" > artifacts.json
          artifact_id="$(python - <<'PY'
          import json
          data=json.load(open('artifacts.json'))
          matches=[a for a in data['artifacts'] if a['name']=='math-0003-exact-r3']
          print(matches[0]['id'] if matches else '')
          PY
          )"
          if [ -z "$artifact_id" ]; then
            cat > comment.md <<EOF
          <!-- math-0003-full-exact-r3-report -->
          ## Unrestricted \`KG(12,3)\` solve

          Workflow \`$RUN_ID\` completed with conclusion \`$conclusion\`, but no certified-result artifact was available. No mathematical conclusion is drawn.
          EOF
            gh pr comment 11 --repo jiaxi1102/open-science-problems --body-file comment.md
            exit 0
          fi

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/artifacts/$artifact_id/zip" --output exact-r3.zip
          unzip -q exact-r3.zip -d exact-r3
          result_status="$(tr -d '\r\n' < exact-r3/status.txt)"
          exit_code="$(tr -d '\r\n' < exact-r3/kissat.exit-code.txt)"
          archive_sha="$(sha256sum exact-r3.zip | cut -d' ' -f1)"
          metadata_sha="$(sha256sum exact-r3/instance-metadata.json | cut -d' ' -f1)"

          if test -f exact-r3/sat-certificate.json; then
            certificate_summary="$(python - <<'PY'
          import json
          x=json.load(open('exact-r3/sat-certificate.json'))
          print(f"model SHA-256: `{x['model_hex_sha256']}`")
          print(f"independently checked triangles: `{x['triangles_checked']}`")
          print(f"monochromatic triangles: `{x['monochromatic_triangles']}`")
          PY
          )"
          elif test -f exact-r3/drat-trim.out; then
            certificate_summary="$(grep -E '^(c |s )|VERIFIED|NOT VERIFIED' exact-r3/drat-trim.out | tail -n 15)"
          else
            certificate_summary='No model/checker certificate found.'
          fi

          cat > comment.md <<EOF
          <!-- math-0003-full-exact-r3-report -->
          ## Unrestricted \`KG(12,3)\` certified solve

          **Workflow:** \`$RUN_ID\` (\`$conclusion\`)  
          **Status:** \`$result_status\`  
          **Kissat exit code:** \`$exit_code\`  
          **Artifact ID:** \`$artifact_id\`  
          **Artifact ZIP SHA-256:** \`$archive_sha\`  
          **Instance metadata SHA-256:** \`$metadata_sha\`

          \`\`\`text
          $certificate_summary
          \`\`\`

          An exact Ramsey-value claim is justified only if the status above is either a fully rechecked SAT model or a DRAT-verified UNSAT proof.
          EOF
          gh pr comment 11 --repo jiaxi1102/open-science-problems --body-file comment.md
