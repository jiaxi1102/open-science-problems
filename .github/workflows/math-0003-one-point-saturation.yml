name: math-0003 one-point saturation

on:
  push:
    branches: [math-0003-one-point-saturation]
    paths:
      - tools/verify_kneser_five_point.py
      - tools/verify_kneser_r3_one_point_saturation.py
      - tools/verify_kneser_general_saturation_templates.py
      - problems/math-0003-kneser-ramsey-lower-bound/proof/r3-one-point-saturation.md
      - problems/math-0003-kneser-ramsey-lower-bound/proof/uniform-one-point-saturation.md
      - problems/math-0003-kneser-ramsey-lower-bound/references/ONE_POINT_SATURATION.md
      - .github/workflows/math-0003-one-point-saturation.yml
  pull_request:
    paths:
      - tools/verify_kneser_five_point.py
      - tools/verify_kneser_r3_one_point_saturation.py
      - tools/verify_kneser_general_saturation_templates.py
      - problems/math-0003-kneser-ramsey-lower-bound/proof/r3-one-point-saturation.md
      - problems/math-0003-kneser-ramsey-lower-bound/proof/uniform-one-point-saturation.md
      - problems/math-0003-kneser-ramsey-lower-bound/references/ONE_POINT_SATURATION.md
      - .github/workflows/math-0003-one-point-saturation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verification programs
        run: |
          python -m py_compile \
            tools/verify_kneser_five_point.py \
            tools/verify_kneser_r3_one_point_saturation.py
      - name: Verify all 55 one-point extension instances
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_kneser_r3_one_point_saturation.py \
            | tee r3-one-point-saturation.json
          test -s r3-one-point-saturation.json
      - uses: actions/upload-artifact@v4
        with:
          name: math-0003-r3-one-point-saturation
          path: r3-one-point-saturation.json
          if-no-files-found: error
          retention-days: 30

  uniform-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verification programs
        run: |
          python -m py_compile \
            tools/verify_kneser_five_point.py \
            tools/verify_kneser_general_saturation_templates.py
      - name: Verify trace recurrences and weighted-cycle inequalities
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_kneser_general_saturation_templates.py \
            | tee uniform-one-point-saturation.json
          test -s uniform-one-point-saturation.json
      - uses: actions/upload-artifact@v4
        with:
          name: math-0003-uniform-one-point-saturation
          path: uniform-one-point-saturation.json
          if-no-files-found: error
          retention-days: 30
