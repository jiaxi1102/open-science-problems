name: research math-0003 trace8

on:
  push:
    branches: [research/math-0003-exact-r3]
    paths:
      - tools/kg12_trace8_sat.py
      - .github/workflows/research-math-0003-trace8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-trace8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate deterministic trace CNF
        run: |
          mkdir -p trace8-result
          python tools/kg12_trace8_sat.py generate \
            --cnf trace8-result/trace8.cnf \
            --metadata trace8-result/instance-metadata.json

      - name: Install pinned Kissat binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/arminbiere/kissat/releases/download/rel-4.0.4/kissat-4.0.4-linux-amd64.zip \
            --output kissat.zip
          echo '63282e5168ca040a2018edfba0726bf893a7a6bcdb1db87feb67857e2da697a7  kissat.zip' \
            | sha256sum --check --strict
          unzip -q kissat.zip -d kissat-dist
          KISSAT=''
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'ELF'; then
              KISSAT="$candidate"
              break
            fi
          done < <(find kissat-dist -type f -print | sort)
          test -n "$KISSAT"
          chmod +x "$KISSAT"
          "$KISSAT" --version | tee trace8-result/kissat-version.txt
          echo "KISSAT=$GITHUB_WORKSPACE/$KISSAT" >> "$GITHUB_ENV"

      - name: Solve and certify trace ansatz
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$KISSAT" --time=900 \
            trace8-result/trace8.cnf trace8-result/trace8.drat \
            > trace8-result/kissat.out 2> trace8-result/kissat.err
          code=$?
          set -e
          printf '%s\n' "$code" > trace8-result/kissat.exit-code.txt

          if [ "$code" -eq 10 ]; then
            python tools/kg12_trace8_sat.py verify-model \
              --solver-output trace8-result/kissat.out \
              --certificate trace8-result/sat-certificate.json
            printf 'SAT_FULL_KG12_MODEL_VERIFIED\n' > trace8-result/status.txt
          elif [ "$code" -eq 20 ]; then
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c \
              --output trace8-result/drat-trim.c
            gcc -O3 -DNDEBUG trace8-result/drat-trim.c -o trace8-result/drat-trim
            trace8-result/drat-trim trace8-result/trace8.cnf trace8-result/trace8.drat \
              > trace8-result/drat-trim.out 2> trace8-result/drat-trim.err
            grep -q 'VERIFIED' trace8-result/drat-trim.out
            printf 'UNSAT_TRACE_ANSATZ_DRAT_VERIFIED\n' > trace8-result/status.txt
          else
            printf 'INCONCLUSIVE_EXIT_%s\n' "$code" > trace8-result/status.txt
            exit 1
          fi

      - name: Record checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find trace8-result -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -print0 | sort -z | xargs -0 sha256sum > trace8-result/SHA256SUMS.txt
          if [ -s trace8-result/trace8.drat ]; then
            gzip -9 trace8-result/trace8.drat
          fi

      - name: Upload trace8 certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-0003-trace8
          path: trace8-result/
          if-no-files-found: error
          retention-days: 90
