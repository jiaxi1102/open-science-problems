name: math-0002 Kneser cover verification

on:
  push:
    paths:
      - problems/math-0002-kneser-fractional-cover/formal/**
      - problems/math-0002-kneser-fractional-cover/verification/**
      - .github/workflows/math-0002-kneser-cover.yml
  pull_request:
    paths:
      - problems/math-0002-kneser-fractional-cover/formal/**
      - problems/math-0002-kneser-fractional-cover/verification/**
      - .github/workflows/math-0002-kneser-cover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run independent exhaustive NAE-SAT verifier
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/verification
        run: |
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            nae_independence_obstruction.cpp -o nae_independence_obstruction
          ./nae_independence_obstruction | tee nae-verification.txt
          grep -E '^UNSAT k=11 tested=170352 overlap=129666 nodes=40027816 ' \
            nae-verification.txt

      - name: Generate the strengthened Lean certificate
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/formal
        run: |
          python generate_lean.py
          echo "2a51c43c1f9ec8e0f2bbfa76cf7333dc1dcc53ded85a67ff5212a863647b68a9  KneserCover.lean" \
            | sha256sum -c -

      - name: Reject unfinished or hand-written axiomatic shortcuts
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/formal
        run: |
          if grep -nE '\b(sorry|admit)\b' KneserCover.lean; then
            echo "Unfinished proof marker found"
            exit 1
          fi
          if grep -nE '^[[:space:]]*axiom[[:space:]]' KneserCover.lean; then
            echo "Hand-written axiom found"
            exit 1
          fi

      - name: Build Lean verification
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: problems/math-0002-kneser-fractional-cover/formal
          build: true
          test: false
          lint: false
          leanchecker: false
          axiom-audit: false
