name: math-0002 Kneser cover verification

on:
  push:
    paths:
      - problems/math-0002-kneser-fractional-cover/formal/**
      - problems/math-0002-kneser-fractional-cover/experiments/**
      - .github/workflows/math-0002-kneser-cover.yml
  pull_request:
    paths:
      - problems/math-0002-kneser-fractional-cover/formal/**
      - problems/math-0002-kneser-fractional-cover/experiments/**
      - .github/workflows/math-0002-kneser-cover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Run independent exact alpha-10 verifier
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover
        run: |
          echo "8ce3435178190958292e87287113ff24af3aaa2a9bc5fde8aaae18a80e69f431  experiments/verify_alpha10.cpp" | sha256sum -c -
          g++ -O3 -std=c++20 -Wall -Wextra -Werror -pedantic \
            experiments/verify_alpha10.cpp -o /tmp/verify_alpha10
          /tmp/verify_alpha10

      - name: Generate the explicit finite certificate
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/formal
        run: |
          python generate_lean.py
          python finalize_lean.py
          echo "e21c37179741f8ddcea0cfc96911da4e50f8c336dc4aa72798acaa5f3a0e6cdb  KneserCover.lean" | sha256sum -c -

      - name: Reject unfinished or hand-written axiomatic shortcuts
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/formal
        run: |
          if grep -nE '\b(sorry|admit)\b' KneserCover.lean; then
            echo "Unfinished proof marker found"
            exit 1
          fi
          if grep -nE '^[[:space:]]*axiom[[:space:]]' KneserCover.lean; then
            echo "Hand-written axiom found"
            exit 1
          fi

      - name: Build Lean verification
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: problems/math-0002-kneser-fractional-cover/formal
          build: true
          test: false
          lint: false
          leanchecker: false
          axiom-audit: false
