name: math-0002 Kneser cover Lean verification

on:
  push:
    paths:
      - problems/math-0002-kneser-fractional-cover/formal/**
      - .github/workflows/math-0002-kneser-cover.yml
  pull_request:
    paths:
      - problems/math-0002-kneser-fractional-cover/formal/**
      - .github/workflows/math-0002-kneser-cover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Generate the explicit finite certificate
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/formal
        run: |
          python generate_lean.py
          python finalize_lean.py
          echo "4e0cb3a700c7c9676c9d2fa54ef89d1fae8cf9a20af42299e601c7e7e0bcb2da  KneserCover.lean" | sha256sum -c -

      - name: Reject unfinished proof markers
        shell: bash
        working-directory: problems/math-0002-kneser-fractional-cover/formal
        run: |
          if grep -nE '\b(sorry|admit)\b' KneserCover.lean; then
            echo "Unfinished proof marker found"
            exit 1
          fi

      - name: Build, audit axioms, and check compiled environment
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: problems/math-0002-kneser-fractional-cover/formal
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "KneserCover"
          axiom-audit: true
          axiom-audit-root: KneserCover
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
