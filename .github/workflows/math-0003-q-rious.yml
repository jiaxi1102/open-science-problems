name: math-0003 q-rious Lean verification

on:
  push:
    branches:
      - research/math-0003-q-rious-counterexample
    paths:
      - problems/math-0003-q-rious-unimodality/formal/**
      - .github/workflows/math-0003-q-rious.yml
  pull_request:
    paths:
      - problems/math-0003-q-rious-unimodality/formal/**
      - .github/workflows/math-0003-q-rious.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject unfinished proof markers
        shell: bash
        working-directory: problems/math-0003-q-rious-unimodality/formal
        run: |
          if grep -nE '\b(sorry|admit)\b' QRiousCounterexample.lean; then
            echo "Unfinished proof marker found"
            exit 1
          fi

      - name: Build, audit axioms, and check compiled environment
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: problems/math-0003-q-rious-unimodality/formal
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "QRiousCounterexample"
          axiom-audit: true
          axiom-audit-root: QRiousCounterexample
          axiom-audit-allow: propext,Classical.choice,Quot.sound
