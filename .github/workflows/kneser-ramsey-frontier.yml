name: Kneser Ramsey frontier

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - experiments/kneser_ramsey/**
      - .github/workflows/kneser-ramsey-frontier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        n: [11, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAT solver
        run: pip install 'python-sat==1.8.dev17'
      - name: Solve KG(${{ matrix.n }},3)
        run: |
          python experiments/kneser_ramsey/solve_triangle_free.py \
            --n ${{ matrix.n }} --k 3 \
            --out experiments/kneser_ramsey/results/kg_${{ matrix.n }}_3.json
      - uses: actions/upload-artifact@v4
        with:
          name: kg-${{ matrix.n }}-3-result
          path: experiments/kneser_ramsey/results/kg_${{ matrix.n }}_3.json
