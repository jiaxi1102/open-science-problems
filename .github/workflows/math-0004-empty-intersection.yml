name: math-0004 empty-intersection Ramsey
on:
  push:
    branches: [math-0004-empty-intersection-ramsey]
    paths:
      - problems/math-0004-empty-intersection-ramsey/**
      - .github/workflows/math-0004-empty-intersection.yml
  pull_request:
    paths:
      - problems/math-0004-empty-intersection-ramsey/**
      - .github/workflows/math-0004-empty-intersection.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: math-0004-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install z3-solver==4.13.3.0
      - name: Reconstruct small lemmas and geometric data
        run: python problems/math-0004-empty-intersection-ramsey/experiments/build_structured.py --out problems/math-0004-empty-intersection-ramsey/formal
      - name: Independently replay the geometric certificate
        run: python problems/math-0004-empty-intersection-ramsey/experiments/verify_certificate.py problems/math-0004-empty-intersection-ramsey/formal/rup-certificate.json --out problems/math-0004-empty-intersection-ramsey/formal/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: empty-intersection-generated-unverified
          path: problems/math-0004-empty-intersection-ramsey/
          retention-days: 30
      - name: Reject unchecked shortcuts
        working-directory: problems/math-0004-empty-intersection-ramsey/formal
        run: |
          if grep -RInE --include='*.lean' '\b(sorry|admit|native_decide|bv_decide)\b|^[[:space:]]*axiom[[:space:]]' .; then exit 1; fi
      - name: Install Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Mathlib cache
        working-directory: problems/math-0004-empty-intersection-ramsey/formal
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          lake exe cache get
      - uses: actions/cache@v4
        with:
          path: problems/math-0004-empty-intersection-ramsey/formal/.lake/build
          key: math-0004-4331-${{ hashFiles('problems/math-0004-empty-intersection-ramsey/experiments/build*.py') }}-${{ github.sha }}
          restore-keys: math-0004-4331-${{ hashFiles('problems/math-0004-empty-intersection-ramsey/experiments/build*.py') }}-
      - name: Check finite and arbitrary-size Ramsey theorems
        shell: bash
        working-directory: problems/math-0004-empty-intersection-ramsey/formal
        run: |
          set -euo pipefail
          lean --version | tee lean-version.txt
          /usr/bin/time -v timeout 900 lake build 2>&1 | tee build.log
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('build.log').read_text()
          for name in ['EmptyIntersection.impossible', 'EmptyIntersection.finiteIntersectionRamsey', 'EmptyIntersection.uniformHalfIntersectionRamsey']:
              matches = re.findall(re.escape("'"+name+"'") + r' depends on axioms:\s*\[([^\]]*)\]', text)
              if not matches:
                  raise SystemExit('Missing exact theorem audit for '+name)
              for match in matches:
                  used = {s.strip() for s in match.split(',') if s.strip()}
                  if not used <= {'propext', 'Classical.choice', 'Quot.sound'}:
                      raise SystemExit('Unexpected axiom dependencies: '+str(used))
              print('PASS: '+name)
          PY
      - name: Record provenance and hashes
        shell: bash
        run: |
          git rev-parse HEAD > problems/math-0004-empty-intersection-ramsey/formal/SOURCE_COMMIT.txt
          printf '%s\n' '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' > problems/math-0004-empty-intersection-ramsey/formal/RUN.txt
          cd problems/math-0004-empty-intersection-ramsey
          find . -type f -not -path './formal/.lake/*' -not -path '*/__pycache__/*' -not -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: empty-intersection-verified
          path: |
            problems/math-0004-empty-intersection-ramsey/*.md
            problems/math-0004-empty-intersection-ramsey/proof/*.md
            problems/math-0004-empty-intersection-ramsey/references/*.md
            problems/math-0004-empty-intersection-ramsey/experiments/*.py
            problems/math-0004-empty-intersection-ramsey/experiments/*.json
            problems/math-0004-empty-intersection-ramsey/formal/*.lean
            problems/math-0004-empty-intersection-ramsey/formal/*.json
            problems/math-0004-empty-intersection-ramsey/formal/*.txt
            problems/math-0004-empty-intersection-ramsey/formal/*.log
            problems/math-0004-empty-intersection-ramsey/formal/lean-toolchain
            problems/math-0004-empty-intersection-ramsey/SHA256SUMS
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: empty-intersection-failed-build-log
          path: problems/math-0004-empty-intersection-ramsey/formal/build.log
          retention-days: 30
