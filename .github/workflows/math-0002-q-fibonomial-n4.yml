name: math-0002 q-Fibonomial n=4 Lean verification

on:
  push:
    branches:
      - proof/math-0002-q-fibonomial-n4
    paths:
      - problems/math-0002-q-fibonomial-n4/**
      - .github/workflows/math-0002-q-fibonomial-n4.yml
  pull_request:
    paths:
      - problems/math-0002-q-fibonomial-n4/**
      - .github/workflows/math-0002-q-fibonomial-n4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unfinished proof markers
        shell: bash
        working-directory: problems/math-0002-q-fibonomial-n4/formal
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' *.lean; then
            echo "Unfinished or added axiom marker found"
            exit 1
          fi
      - name: Build, audit axioms, and check compiled environment
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: problems/math-0002-q-fibonomial-n4/formal
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "QFibonomial4 QFibonomial4All QFibonomial4Series"
          axiom-audit: true
          axiom-audit-root: QFibonomial4
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
