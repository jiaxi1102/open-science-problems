name: research math-0003 exact r3

on:
  push:
    branches: [research/math-0003-exact-r3]
    paths:
      - tools/kg12_r3_sat.py
      - problems/math-0003-kneser-ramsey-lower-bound/experiments/kg12-r3/**
      - .github/workflows/research-math-0003-exact-r3.yml
  pull_request:
    paths:
      - tools/kg12_r3_sat.py
      - problems/math-0003-kneser-ramsey-lower-bound/experiments/kg12-r3/**
      - .github/workflows/research-math-0003-exact-r3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate deterministic KG(12,3) CNF
        run: |
          mkdir -p result
          python tools/kg12_r3_sat.py generate \
            --cnf result/kg12-r3.cnf \
            --metadata result/instance-metadata.json

      - name: Install pinned Kissat binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/arminbiere/kissat/releases/download/rel-4.0.4/kissat-4.0.4-linux-amd64.zip \
            --output kissat.zip
          echo '63282e5168ca040a2018edfba0726bf893a7a6bcdb1db87feb67857e2da697a7  kissat.zip' \
            | sha256sum --check --strict
          unzip -q kissat.zip -d kissat-dist
          KISSAT="$(find kissat-dist -type f -name kissat -print -quit)"
          test -n "$KISSAT"
          chmod +x "$KISSAT"
          "$KISSAT" --version | tee result/kissat-version.txt
          echo "KISSAT=$GITHUB_WORKSPACE/$KISSAT" >> "$GITHUB_ENV"

      - name: Solve and verify the decisive result
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$KISSAT" --time=2400 \
            result/kg12-r3.cnf result/kg12-r3.drat \
            > result/kissat.out 2> result/kissat.err
          code=$?
          set -e
          printf '%s\n' "$code" > result/kissat.exit-code.txt

          if [ "$code" -eq 10 ]; then
            python tools/kg12_r3_sat.py verify-model \
              --solver-output result/kissat.out \
              --certificate result/sat-certificate.json
            printf 'SAT_MODEL_VERIFIED\n' > result/status.txt
          elif [ "$code" -eq 20 ]; then
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c \
              --output result/drat-trim.c
            sha256sum result/drat-trim.c > result/drat-trim-source.sha256
            gcc -O3 -DNDEBUG result/drat-trim.c -o result/drat-trim
            result/drat-trim result/kg12-r3.cnf result/kg12-r3.drat \
              > result/drat-trim.out 2> result/drat-trim.err
            grep -q 'VERIFIED' result/drat-trim.out
            printf 'UNSAT_DRAT_VERIFIED\n' > result/status.txt
          else
            printf 'INCONCLUSIVE_EXIT_%s\n' "$code" > result/status.txt
            cat result/kissat.out
            cat result/kissat.err >&2
            exit 1
          fi

      - name: Record checksums and compress large proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find result -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -print0 | sort -z | xargs -0 sha256sum > result/SHA256SUMS.txt
          if [ -s result/kg12-r3.drat ]; then
            gzip -9 result/kg12-r3.drat
          fi

      - name: Upload exact-r3 research certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-0003-exact-r3
          path: result/
          if-no-files-found: error
          retention-days: 90
