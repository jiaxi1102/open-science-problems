name: Trace-gadget minimal obstruction

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - tools/trace_gadget_mus.py
      - .github/workflows/trace-gadget-mus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAT solver
        run: pip install 'python-sat==1.8.dev17'
      - name: Extract irreducible core for seven points and threshold four
        run: |
          python tools/trace_gadget_mus.py \
            --m 7 --threshold 4 \
            --out experiments/kneser_ramsey/results/trace-mus-m7-t4.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-mus-m7-t4
          path: experiments/kneser_ramsey/results/trace-mus-m7-t4.json
          if-no-files-found: warn
