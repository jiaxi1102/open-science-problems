name: Kneser balanced-cut factor search

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - tools/kneser_union_factor.py
      - .github/workflows/kneser-union-factor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        r: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAT solver
        run: pip install 'python-sat==1.8.dev17'
      - name: Solve balanced-cut factor
        run: |
          python tools/kneser_union_factor.py \
            --r ${{ matrix.r }} \
            --out experiments/kneser_ramsey/results/kg_4r_r_union_factor_r${{ matrix.r }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-4r-r-union-factor-r${{ matrix.r }}
          path: experiments/kneser_ramsey/results/kg_4r_r_union_factor_r${{ matrix.r }}.json
          if-no-files-found: warn
