name: Verify KG(11,3) one-point saturation

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - tools/verify_kneser_five_point.py
      - tools/verify_kneser_r3_one_point_saturation.py
      - experiments/kneser_ramsey/R3_ONE_POINT_SATURATION.md
      - .github/workflows/kneser-r3-one-point-saturation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 55 extension instances and explicit obstruction cores
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_kneser_r3_one_point_saturation.py \
            | tee one-point-saturation.json
          test -s one-point-saturation.json
      - uses: actions/upload-artifact@v4
        with:
          name: kg11-r3-one-point-saturation
          path: one-point-saturation.json
          if-no-files-found: error
          retention-days: 30
