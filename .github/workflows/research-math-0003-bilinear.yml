name: research math-0003 bilinear parity

on:
  push:
    branches: [research/math-0003-exact-r3]
    paths:
      - tools/kg12_bilinear_sat.py
      - .github/workflows/research-math-0003-bilinear.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        mode: [bilinear, switched-bilinear]
        branch: [matching, path]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate algebraic CNF
        shell: bash
        run: |
          set -euo pipefail
          MODE='${{ matrix.mode }}'
          BRANCH='${{ matrix.branch }}'
          DIR="bilinear-$MODE-$BRANCH"
          mkdir -p "$DIR"
          python tools/kg12_bilinear_sat.py --mode "$MODE" --branch "$BRANCH" generate \
            --cnf "$DIR/instance.cnf" \
            --metadata "$DIR/instance-metadata.json" \
            --map "$DIR/model-map.json"

      - name: Install pinned Kissat binary
        shell: bash
        run: |
          set -euo pipefail
          MODE='${{ matrix.mode }}'
          BRANCH='${{ matrix.branch }}'
          DIR="bilinear-$MODE-$BRANCH"
          curl --fail --location --retry 3 \
            https://github.com/arminbiere/kissat/releases/download/rel-4.0.4/kissat-4.0.4-linux-amd64.zip \
            --output kissat.zip
          echo '63282e5168ca040a2018edfba0726bf893a7a6bcdb1db87feb67857e2da697a7  kissat.zip' \
            | sha256sum --check --strict
          unzip -q kissat.zip -d kissat-dist
          KISSAT=''
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'ELF'; then
              KISSAT="$candidate"
              break
            fi
          done < <(find kissat-dist -type f -print | sort)
          test -n "$KISSAT"
          chmod +x "$KISSAT"
          "$KISSAT" --version | tee "$DIR/kissat-version.txt"
          echo "KISSAT=$GITHUB_WORKSPACE/$KISSAT" >> "$GITHUB_ENV"

      - name: Solve and independently verify every SAT model
        shell: bash
        run: |
          set -euo pipefail
          MODE='${{ matrix.mode }}'
          BRANCH='${{ matrix.branch }}'
          DIR="bilinear-$MODE-$BRANCH"
          set +e
          "$KISSAT" --time=900 "$DIR/instance.cnf" \
            > "$DIR/kissat.out" 2> "$DIR/kissat.err"
          code=$?
          set -e
          printf '%s\n' "$code" > "$DIR/kissat.exit-code.txt"
          if [ "$code" -eq 10 ]; then
            python tools/kg12_bilinear_sat.py --mode "$MODE" --branch "$BRANCH" verify-model \
              --solver-output "$DIR/kissat.out" \
              --map "$DIR/model-map.json" \
              --certificate "$DIR/sat-certificate.json"
            printf 'SAT_FULL_KG12_MODEL_VERIFIED\n' > "$DIR/status.txt"
          elif [ "$code" -eq 20 ]; then
            printf 'UNSAT_BILINEAR_ANSATZ_ONLY\n' > "$DIR/status.txt"
          else
            printf 'INCONCLUSIVE_EXIT_%s\n' "$code" > "$DIR/status.txt"
            exit 1
          fi
          cat "$DIR/status.txt"

      - name: Record checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MODE='${{ matrix.mode }}'
          BRANCH='${{ matrix.branch }}'
          DIR="bilinear-$MODE-$BRANCH"
          find "$DIR" -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -print0 | sort -z | xargs -0 sha256sum > "$DIR/SHA256SUMS.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-0003-bilinear-${{ matrix.mode }}-${{ matrix.branch }}
          path: bilinear-${{ matrix.mode }}-${{ matrix.branch }}/
          if-no-files-found: error
          retention-days: 90
