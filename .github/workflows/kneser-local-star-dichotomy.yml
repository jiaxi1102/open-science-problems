name: Kneser nine-point local-star dichotomy

on:
  push:
    branches: [math-kneser-ramsey-frontier]
    paths:
      - tools/kneser_local_star_dichotomy.py
      - .github/workflows/kneser-local-star-dichotomy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the negated dichotomy and sharpness witnesses
        run: |
          mkdir -p out/local-star
          python -m py_compile tools/kneser_local_star_dichotomy.py
          python tools/kneser_local_star_dichotomy.py generate \
            --cnf out/local-star/dichotomy.cnf \
            --metadata out/local-star/metadata.json \
            --clause-map out/local-star/clause-map.json
          python tools/kneser_local_star_dichotomy.py check-witnesses \
            > out/local-star/sharpness-witnesses.json

      - name: Build pinned CaDiCaL and DRAT-trim
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/arminbiere/cadical.git /tmp/cadical
          git -C /tmp/cadical checkout --quiet c60730422e758ef1cebe7aeddf2dda31c996bf04
          (cd /tmp/cadical && ./configure)
          make -C /tmp/cadical/build -j2

          git clone --quiet https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C /tmp/drat-trim -j2

          /tmp/cadical/build/cadical --version > out/local-star/cadical-version.txt
          git -C /tmp/cadical rev-parse HEAD > out/local-star/cadical-commit.txt
          git -C /tmp/drat-trim rev-parse HEAD > out/local-star/drat-trim-commit.txt

      - name: Produce and independently check the UNSAT proof
        shell: bash
        run: |
          set +e
          /tmp/cadical/build/cadical \
            out/local-star/dichotomy.cnf \
            out/local-star/dichotomy.drat \
            > out/local-star/cadical.log 2>&1
          rc=$?
          set -e
          echo "$rc" > out/local-star/cadical-exit-code.txt
          test "$rc" -eq 20

          /tmp/drat-trim/drat-trim \
            out/local-star/dichotomy.cnf \
            out/local-star/dichotomy.drat \
            > out/local-star/drat-trim.log 2>&1

          grep -q 'VERIFIED' out/local-star/drat-trim.log
          sha256sum \
            out/local-star/dichotomy.cnf \
            out/local-star/dichotomy.drat \
            > out/local-star/certificate-sha256.txt

      - name: Cross-check with independent SAT engines and extract an irreducible core
        run: |
          pip install 'python-sat==1.8.dev17'
          python - <<'PY'
          import json
          from pathlib import Path
          from pysat.formula import CNF
          from pysat.solvers import Cadical195, Glucose42, Minisat22

          root = Path('out/local-star')
          cnf = CNF(from_file=str(root / 'dichotomy.cnf'))
          results = {}
          for name, solver_type in (
              ('cadical195', Cadical195),
              ('glucose42', Glucose42),
              ('minisat22', Minisat22),
          ):
              with solver_type(bootstrap_with=cnf.clauses) as solver:
                  results[name] = bool(solver.solve())
          assert results == {
              'cadical195': False,
              'glucose42': False,
              'minisat22': False,
          }

          selector_base = cnf.nv + 1
          selectors = [selector_base + i for i in range(len(cnf.clauses))]
          with Cadical195() as solver:
              for clause, selector in zip(cnf.clauses, selectors):
                  solver.add_clause(clause + [-selector])
              active = list(selectors)
              assert not solver.solve(assumptions=active)
              for selector in list(active):
                  trial = [value for value in active if value != selector]
                  if not solver.solve(assumptions=trial):
                      active = trial

          indices = [selector - selector_base for selector in active]
          core = [cnf.clauses[index] for index in indices]
          with Cadical195(bootstrap_with=core) as solver:
              assert not solver.solve()
          for position in range(len(core)):
              trial = core[:position] + core[position + 1:]
              with Cadical195(bootstrap_with=trial) as solver:
                  assert solver.solve()

          with (root / 'irreducible-core.cnf').open('w') as handle:
              handle.write(f'p cnf {cnf.nv} {len(core)}\n')
              for clause in core:
                  handle.write(' '.join(map(str, clause)) + ' 0\n')

          clause_map = json.loads((root / 'clause-map.json').read_text())
          mapped = [
              {
                  'original_clause_index': index + 1,
                  **clause_map['clauses'][str(index + 1)],
              }
              for index in indices
          ]
          summary = {
              'independent_solver_satisfiable': results,
              'original_clauses': len(cnf.clauses),
              'irreducible_core_clauses': len(core),
              'core_original_indices': [index + 1 for index in indices],
              'core_semantics': mapped,
          }
          (root / 'independent-check.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload local-star theorem certificate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kneser-local-star-dichotomy
          path: out/local-star
          if-no-files-found: error
          retention-days: 90
